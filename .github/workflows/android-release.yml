name: Android release

# Builds a signed App Bundle and attaches it to a GitHub release, ready for Play.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android-release.yml"

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Public values only: the Supabase publishable key is designed to ship inside apps (RLS protects data).
      FV_SUPABASE_URL: https://hpxolqagnxbgotilkicg.supabase.co
      FV_SUPABASE_ANON_KEY: sb_publishable_7shxjc-8Hkkgy-aKIpEAVA_Dh6Hv2ZM
      FV_API_BASE_URL: ${{ vars.FV_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Check configuration
        run: |
          if [ -z "$FV_API_BASE_URL" ]; then
            echo "::error::Repository variable FV_API_BASE_URL (the Worker URL) is not set"
            exit 1
          fi

      - name: Unpack upload key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -z "$ANDROID_SIGNING" ]; then
            echo "::error::Repository secret ANDROID_SIGNING is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_SIGNING" | base64 -d | tar -xz -C "$RUNNER_TEMP/signing"
          echo "FV_KEYSTORE_PATH=$RUNNER_TEMP/signing/upload.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat "$RUNNER_TEMP/signing/password")"
          echo "FV_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/signing/password")" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:bundleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Verify signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v1.0.0-${{ github.run_number }}"
          cp app/build/outputs/bundle/release/app-release.aab "flight-view-${{ github.run_number }}.aab"
          gh release create "$tag" "flight-view-${{ github.run_number }}.aab" \
            --title "Android build ${{ github.run_number }}" \
            --notes "Signed App Bundle for Google Play internal testing. versionCode ${{ github.run_number }}." \
            --prerelease
