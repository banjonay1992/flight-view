version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/worker
    schedule:
      interval: weekly
    groups:
      worker:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
