# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: FlightView
options:
  bundleIdPrefix: com.nayproductions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  FlightViewCore:
    path: Packages/FlightViewCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  FlightView:
    type: application
    platform: iOS
    sources:
      - path: FlightView
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: FlightViewCore
      - package: Supabase
        product: Supabase
    info:
      path: FlightView/Resources/Info.plist
      properties:
        CFBundleDisplayName: Flight View
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, magnetometer, gyroscope, location-services, still-camera]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Flight View shows the sky through your camera and labels the aircraft in it. Video stays on your phone.
        NSLocationWhenInUseUsageDescription: Flight View uses your location to find aircraft near you. Only an area of about 10 km is sent to our server.
        NSMotionUsageDescription: Flight View uses the compass and motion sensors to know where your phone is pointing.
        FVApiBaseURL: $(FV_API_BASE_URL)
        FVSupabaseURL: $(FV_SUPABASE_URL)
        FVSupabaseAnonKey: $(FV_SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nayproductions.flightview
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: NO

  FlightViewTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FlightViewTests]
    dependencies:
      - target: FlightView

schemes:
  FlightView:
    build:
      targets:
        FlightView: all
        FlightViewTests: [test]
    test:
      targets:
        - FlightViewTests
        - package: FlightViewCore/FlightViewCoreTests
