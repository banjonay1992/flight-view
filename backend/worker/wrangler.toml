name = "flightview-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# Feeds queried from Cloudflare. adsb.fi and OpenSky block cloud providers, so the apps
# query those two directly; airplanes.live now requires approval and ADSB One blocks all
# automated access. Their adapters stay in src/providers for when access is granted.
# FlyItalyADSB is skipped until FLYITALY_API_KEY is set. COMMERCIAL_MODE = "true" drops
# feeds whose terms forbid commercial use.
PROVIDERS = "adsblol,flyitaly"
COMMERCIAL_MODE = "false"
REQUIRE_AUTH = "true"
SUPABASE_URL = "https://hpxolqagnxbgotilkicg.supabase.co"
# Free feeds ask callers to identify themselves.
USER_AGENT = "FlightView/1.0 (NAY Productions; Flight View plane-spotting app)"

# Secrets (wrangler secret put ...):
#   FLYITALY_API_KEY        free key from flyitalyadsb.com (commercial use allowed)
#   OPENSKY_CLIENT_ID       free OpenSky account API client
#   OPENSKY_CLIENT_SECRET

[[durable_objects.bindings]]
name = "RATE_GATE"
class_name = "RateGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateGate"]

# Per-user (or per-IP) limit: the apps poll every 2 s, so 60 per minute leaves headroom.
[[unsafe.bindings]]
name = "USER_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
